name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint, types and web export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_PUBLIC_API_URL: https://example.invalid/api
      EXPO_PUBLIC_GOOGLE_CLIENT_ID: ci-client-id.apps.googleusercontent.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Export production web build
        run: npx expo export --platform web


  visual:
    name: Visual regression
    runs-on: macos-14
    timeout-minutes: 15
    env:
      EXPO_PUBLIC_API_URL: https://example.invalid/api
      EXPO_PUBLIC_GOOGLE_CLIENT_ID: ci-client-id.apps.googleusercontent.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install visual-test browser
        run: npx playwright install chromium

      - name: Compare visual references
        run: npm run test:visual

      - name: Upload visual differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            playwright-report
            test-results/visual
          if-no-files-found: ignore
          retention-days: 7
